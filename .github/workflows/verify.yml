name: Verify backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: underlab_test
          POSTGRES_PASSWORD: underlab_ci_fixture
          POSTGRES_DB: underlab_test
        options: >-
          --health-cmd "pg_isready -U underlab_test -d underlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://underlab_test:underlab_ci_fixture@127.0.0.1:5432/underlab_test?schema=public
      DIRECT_URL: postgresql://underlab_test:underlab_ci_fixture@127.0.0.1:5432/underlab_test?schema=public
      TEST_DATABASE_URL: postgresql://underlab_test:underlab_ci_fixture@127.0.0.1:5432/underlab_test?schema=public
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
